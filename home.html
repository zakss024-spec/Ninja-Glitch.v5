<section class="page" data-page="home">
  <div class="glass hero">
    <div class="stage-art sm">
      <div class="orbit-wrap"><div class="orbit o1"></div><div class="orbit o2"></div></div>
      <div class="bh"><img class="bh-img" src="assets/images/blackhole.webp" alt="" onerror="this.remove()"></div>
      <div class="ninja-box float"><img src="assets/images/ninja.webp" alt="Ninja" onerror="this.remove()"></div>
    </div>
    <h1 class="neon-c">WELCOME, <span id="h-code" class="neon-p">AGENT</span></h1>
    <p class="mono mut" style="font-size:.66rem">NINJA GLITCH CONSOLE // LOCAL SIMULATION</p>
  </div>

  <div class="glass">
    <div class="row">
      <div class="ring" id="h-ring" style="--v:92"><b class="neon-c mono" id="h-core">92%</b></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <h2 class="neon-g" style="margin:0">CORE STATUS</h2>
        <div class="ind"><span class="dot"></span><span class="mono">CORE ONLINE</span></div>
        <div class="ind mono mut">UPTIME <b class="neon-c" id="h-up">00:00:00</b></div>
      </div>
    </div>
  </div>

  <div class="glass">
    <h2 class="neon-p">SYSTEM STATUS</h2>
    <div class="grid2">
      <div class="stat">CPU <b id="s-cpu">32%</b><div class="bar"><i id="sb-cpu" style="width:32%"></i></div></div>
      <div class="stat">MEMORY <b id="s-mem">48%</b><div class="bar"><i id="sb-mem" style="width:48%"></i></div></div>
      <div class="stat">SIGNAL <b id="s-sig">76%</b><div class="bar"><i id="sb-sig" style="width:76%"></i></div></div>
      <div class="stat">SHIELD <b id="s-shd">99%</b><div class="bar"><i id="sb-shd" style="width:99%"></i></div></div>
    </div>
  </div>

  <div class="glass">
    <h2 class="neon-c">QUICK ACTIONS</h2>
    <div class="quick">
      <button class="btn sm" type="button" data-go="glitch">RUN GLITCH</button>
      <button class="btn sm alt" type="button" data-go="tools">SYSTEM SCAN</button>
      <button class="btn sm green" type="button" data-go="ninja">CORE</button>
      <button class="btn sm alt" type="button" id="h-clear">CLEAR LOG</button>
    </div>
  </div>

  <div class="glass">
    <h2 class="neon-g">MODULES</h2>
    <div class="modules">
      <button class="module" type="button" data-go="glitch"><span class="mi">&#9672;</span><b>GLITCH LAB</b><small>Simulasi glitch visual</small></button>
      <button class="module" type="button" data-go="ninja"><span class="mi">&#10022;</span><b>NINJA CORE</b><small>Reaktor energi ninja</small></button>
      <button class="module" type="button" data-go="tools"><span class="mi">&#9881;</span><b>TOOLS</b><small>Scan, sinyal, info</small></button>
      <button class="module" type="button" data-go="lab"><span class="mi">&#9638;</span><b>LAB</b><small>Konsol eksperimental</small></button>
      <button class="module" type="button" data-go="rat"><span class="mi">&#9741;</span><b>RAT SIM</b><small>UI simulasi saja</small></button>
      <button class="module" type="button" data-go="history"><span class="mi">&#9719;</span><b>HISTORY</b><small>Log aktivitas lokal</small></button>
      <button class="module wide" type="button" data-go="settings"><span class="mi">&#9672;</span><b>SETTINGS</b><small>Animasi, efek, suara, reset</small></button>
    </div>
  </div>

  <div class="glass">
    <h2 class="neon-p">ACTIVITY LOGS</h2>
    <div class="list" id="h-logs"></div>
  </div>

  <div class="glass">
    <h2 class="neon-c">CONSOLE</h2>
    <div class="term" id="h-con"></div>
  </div>

  <div class="glass dev-card">
    <h3>DEVELOPER CREDITS</h3>
    <div class="dev-grid">
      <div class="dev-box" tabindex="0"><small>DEVELOPER</small><b>ZAKSS</b></div>
      <div class="dev-box" tabindex="0"><small>DEVELOPER</small><b>DAKA</b></div>
      <div class="dev-box" tabindex="0"><small>DEVELOPER</small><b>NATHAN</b></div>
    </div>
  </div>
</section>
