<section class="page" data-page="lab">
  <div class="glass">
    <h2 class="neon-g">LAB CONSOLE</h2>
    <div class="term" id="l-term" style="height:230px"></div>
    <form class="cmd" id="l-form" autocomplete="off">
      <input id="l-in" type="text" placeholder="ketik: help" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn sm" type="submit">RUN</button>
    </form>
  </div>

  <div class="glass">
    <h2 class="neon-c">EXPERIMENT</h2>
    <div class="bar full"><i id="l-bar"></i></div>
    <div class="row" style="margin:8px 0"><span class="mono neon-g" id="l-pct">0%</span><span class="mono mut" id="l-state" style="font-size:.66rem">IDLE</span></div>
  </div>

  <div class="glass">
    <h2 class="neon-p">STATUS CARDS</h2>
    <div class="grid2">
      <div class="item"><span>ENTROPY</span><b class="mono neon-c" id="lc-1">0.42</b></div>
      <div class="item"><span>LATENCY</span><b class="mono neon-g" id="lc-2">12ms</b></div>
      <div class="item"><span>THREADS</span><b class="mono neon-c" id="lc-3">4</b></div>
      <div class="item"><span>MODE</span><b class="mono neon-p" id="lc-4">SIM</b></div>
    </div>
  </div>
</section>
